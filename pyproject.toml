[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSOF_ArduBridge"
version = "1.0.0"
description = "Protocol stack to bridge between an Arduino and Python"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=2.7"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Guy Soffer", email = "gsoffer@yahoo.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.2",
  "Programming Language :: Python :: 3.3",
  "Programming Language :: Python :: 3.4",
  "Programming Language :: Python :: 3.5",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
]
keywords = ["ArduBridge"]
urls = { "Homepage" = "https://github.com/mrGSOF/arduBridge.git" }
dependencies = [
  "pyserial>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["GSOF_ArduBridge*"]
